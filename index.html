<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Obras — Gauss Energia</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    /* Reset & Layout */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg-paper);
      color: var(--fg-1);
      padding: var(--space-6) var(--space-5);
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--border-hairline);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .header-title h1 {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--fg-1);
      margin: 0;
    }

    .header-title .subtitle {
      font-size: var(--fs-sm);
      color: var(--fg-3);
      margin-top: 2px;
    }

    /* Search Bar */
    .search-container {
      margin-bottom: var(--space-6);
      position: relative;
    }

    .search-input {
      width: 100%;
      max-width: 600px;
      padding: var(--space-3) var(--space-4);
      padding-left: var(--space-7);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      border: 2px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--fg-1);
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gauss-green);
      box-shadow: var(--shadow-glow-green);
    }

    .search-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--fg-3);
    }

    /* KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-7);
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-xs);
      transition: all 0.2s;
    }

    .kpi-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--gauss-green-300);
    }

    .kpi-value {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 800;
      color: var(--gauss-green-900);
      line-height: 1;
      margin-bottom: var(--space-2);
    }

    .kpi-label {
      font-size: var(--fs-sm);
      color: var(--fg-3);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      font-weight: 600;
    }

    /* Timeline Section */
    .timeline-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-7);
      box-shadow: var(--shadow-sm);
    }

    .timeline-header {
      text-align: center;
      margin-bottom: var(--space-5);
    }

    .timeline-header h2 {
      font-size: var(--fs-h2);
      font-weight: 700;
      color: var(--fg-1);
      margin-bottom: var(--space-2);
    }

    /* Timeline Controls */
    .timeline-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
      flex-wrap: wrap;
    }

    .timeline-controls button {
      padding: var(--space-2) var(--space-4);
      background: var(--gauss-green);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: var(--fs-sm);
    }

    .timeline-controls button:hover {
      background: var(--gauss-green-700);
      transform: translateY(-1px);
    }

    .timeline-controls button:disabled {
      background: var(--bg-sunken);
      color: var(--fg-3);
      cursor: not-allowed;
      transform: none;
    }

    .timeline-controls select {
      padding: var(--space-2) var(--space-3);
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      border: 2px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--fg-1);
      cursor: pointer;
      font-weight: 600;
    }

    .timeline-controls select:focus {
      outline: none;
      border-color: var(--gauss-green);
    }

    .timeline-controls label {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--fg-2);
    }

    /* Timeline Scroll Container */
    .timeline-scroll-container {
      overflow-x: auto;
      overflow-y: visible;
      margin: 0 calc(-1 * var(--space-6));
      padding: 0 var(--space-6);
      /* Estilização da scrollbar */
      scrollbar-width: thin;
      scrollbar-color: var(--gauss-green-300) var(--bg-sunken);
    }

    .timeline-scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    .timeline-scroll-container::-webkit-scrollbar-track {
      background: var(--bg-sunken);
      border-radius: 4px;
    }

    .timeline-scroll-container::-webkit-scrollbar-thumb {
      background: var(--gauss-green-300);
      border-radius: 4px;
    }

    .timeline-scroll-container::-webkit-scrollbar-thumb:hover {
      background: var(--gauss-green);
    }

    .timeline-content {
      min-width: min-content;
    }

    .timeline-days {
      display: grid;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
      text-align: center;
    }

    .timeline-day {
      padding: var(--space-2);
      background: var(--bg-sunken);
      border-radius: var(--radius-sm);
      min-width: 60px;
    }

    /* Ajuste dinâmico para muitos dias */
    .timeline-days.many-days .timeline-day {
      min-width: 50px;
      padding: var(--space-1) 4px;
    }

    .timeline-days.many-days .timeline-day-num {
      font-size: var(--fs-body);
    }

    .timeline-days.many-days .timeline-day-name {
      font-size: 9px;
    }

    .timeline-day-num {
      font-weight: 700;
      font-size: var(--fs-h4);
      color: var(--fg-1);
    }

    .timeline-day-name {
      font-size: var(--fs-xs);
      color: var(--fg-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #timelineProjects {
      min-width: 100%;
    }

    /* Period Filter */
    .period-filter {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-5);
      padding: var(--space-4);
      background: var(--bg-sunken);
      border-radius: var(--radius-md);
      flex-wrap: wrap;
    }

    .period-filter-label {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .period-filter select {
      padding: var(--space-2) var(--space-3);
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--fg-1);
      cursor: pointer;
      min-width: 120px;
    }

    .period-filter select:focus {
      outline: none;
      border-color: var(--gauss-green);
    }

    .period-filter-reset {
      padding: var(--space-2) var(--space-4);
      background: transparent;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--fg-2);
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-filter-reset:hover {
      background: var(--gauss-green);
      color: white;
      border-color: var(--gauss-green);
    }

    /* Region Tabs */
    .region-tabs {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-5);
      border-bottom: 2px solid var(--border-hairline);
    }

    .region-tab {
      padding: var(--space-3) var(--space-5);
      font-family: var(--font-display);
      font-size: var(--fs-body);
      font-weight: 600;
      color: var(--fg-3);
      background: transparent;
      border: none;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .region-tab:hover {
      color: var(--fg-1);
    }

    .region-tab.active {
      color: var(--gauss-green-900);
      border-bottom-color: var(--gauss-green);
    }

    /* Project Cards Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .project-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: var(--space-5);
      box-shadow: var(--shadow-xs);
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--gauss-green-300);
      transform: translateY(-2px);
    }

    .project-card.expanded {
      grid-column: span 2;
      box-shadow: var(--shadow-md);
    }

    .project-card.has-pending {
      border-left: 4px solid var(--signal-warn);
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-3);
    }

    .project-code {
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--gauss-green-900);
      background: var(--gauss-green-100);
      padding: 4px 8px;
      border-radius: var(--radius-xs);
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: var(--fs-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-finalizada {
      background: #E6F5EA;
      color: #1B5D24;
    }

    .status-andamento {
      background: #FFF4E6;
      color: #B45F06;
    }

    .status-programada {
      background: #E8F4FF;
      color: #1E40AF;
    }

    .status-pendencia {
      background: #FEE;
      color: #B91C1C;
    }

    .project-client {
      font-size: var(--fs-h4);
      font-weight: 700;
      color: var(--fg-1);
      margin-bottom: var(--space-2);
      line-height: 1.3;
    }

    .project-city {
      font-size: var(--fs-sm);
      color: var(--fg-3);
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .project-date {
      font-size: var(--fs-sm);
      color: var(--fg-2);
      font-family: var(--font-mono);
      margin-bottom: var(--space-3);
    }

    .project-meta {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: var(--radius-xs);
      font-size: var(--fs-xs);
      font-weight: 600;
    }

    .meta-badge.material-sent {
      background: #E6F5EA;
      color: #1B5D24;
    }

    .meta-badge.material-pending {
      background: #FFF4E6;
      color: #B45F06;
    }

    .meta-badge.has-issue {
      background: #FEE;
      color: #B91C1C;
    }

    .project-details {
      display: none;
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-hairline);
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .project-card.expanded .project-details {
      display: grid;
    }

    .detail-item {
      font-size: var(--fs-sm);
    }

    .detail-label {
      font-weight: 600;
      color: var(--fg-3);
      text-transform: uppercase;
      font-size: var(--fs-xs);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .detail-value {
      color: var(--fg-1);
    }

    .detail-value.alert {
      color: var(--signal-warn);
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8);
      color: var(--fg-3);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: var(--space-3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: var(--space-4) var(--space-3);
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .timeline-controls {
        flex-direction: column;
        align-items: stretch;
      }

      .timeline-controls select,
      .timeline-controls button {
        width: 100%;
      }

      .timeline-scroll-container {
        margin: 0 calc(-1 * var(--space-3));
        padding: 0 var(--space-3);
      }

      .period-filter {
        flex-direction: column;
        align-items: stretch;
      }

      .period-filter select {
        width: 100%;
      }

      .projects-grid {
        grid-template-columns: 1fr;
      }

      .project-card.expanded {
        grid-column: span 1;
      }

      .project-details {
        grid-template-columns: 1fr;
      }
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: var(--space-8);
      color: var(--fg-3);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--gauss-green-100);
      border-top-color: var(--gauss-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto var(--space-3);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scroll hint */
    .scroll-hint {
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--fg-3);
      margin-top: var(--space-2);
      font-style: italic;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <div class="header-title">
        <h1>Agenda de Obras</h1>
        <div class="subtitle">Gestão de Projetos — Gauss Energia</div>
      </div>
    </div>
  </header>

  <!-- Search -->
  <div class="search-container">
    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
    <input 
      type="text" 
      class="search-input" 
      id="searchInput"
      placeholder="Buscar por código do projeto ou nome do cliente..."
    >
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpiGrid">
    <div class="kpi-card">
      <div class="kpi-value" id="kpiTotal">—</div>
      <div class="kpi-label">Obras Totais</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpiProgramada">—</div>
      <div class="kpi-label">Programadas</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpiAndamento">—</div>
      <div class="kpi-label">Em Execução</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpiConcluida">—</div>
      <div class="kpi-label">Concluídas</div>
    </div>
  </div>

  <!-- Timeline Section -->
  <div class="timeline-section">
    <div class="timeline-header">
      <h2 id="timelineMonth">JANEIRO 2025</h2>
    </div>
    
    <!-- Timeline Controls -->
    <div class="timeline-controls">
      <button onclick="previousPeriod()">◀ Anterior</button>
      
      <label for="daysToShow">Mostrar:</label>
      <select id="daysToShow" onchange="updateTimelineDays()">
        <option value="3">3 dias</option>
        <option value="5">5 dias</option>
        <option value="7" selected>7 dias</option>
        <option value="10">10 dias</option>
        <option value="14">14 dias</option>
        <option value="21">21 dias</option>
        <option value="30">30 dias</option>
      </select>
      
      <button onclick="goToToday()">Hoje</button>
      <button onclick="nextPeriod()">Próximo ▶</button>
    </div>

    <!-- Scroll Container -->
    <div class="timeline-scroll-container" id="timelineScrollContainer">
      <div class="timeline-content">
        <div class="timeline-days" id="timelineDays">
          <!-- Dias serão inseridos via JS -->
        </div>
        <div id="timelineProjects">
          <!-- Projetos do timeline serão inseridos via JS -->
        </div>
      </div>
    </div>
    <div class="scroll-hint" id="scrollHint" style="display: none;">
      ← Arraste horizontalmente para ver mais dias →
    </div>
  </div>

  <!-- Period Filter -->
  <div class="period-filter">
    <span class="period-filter-label">Filtrar por Período:</span>
    <select id="monthFilter">
      <option value="">Todos os meses</option>
      <option value="1">Janeiro</option>
      <option value="2">Fevereiro</option>
      <option value="3">Março</option>
      <option value="4">Abril</option>
      <option value="5">Maio</option>
      <option value="6">Junho</option>
      <option value="7">Julho</option>
      <option value="8">Agosto</option>
      <option value="9">Setembro</option>
      <option value="10">Outubro</option>
      <option value="11">Novembro</option>
      <option value="12">Dezembro</option>
    </select>
    <select id="yearFilter">
      <option value="">Todos os anos</option>
    </select>
    <button class="period-filter-reset" onclick="resetPeriodFilter()">Limpar Filtros</button>
  </div>

  <!-- Region Tabs -->
  <div class="region-tabs">
    <button class="region-tab active" data-region="todas" onclick="filterByRegion('todas')">
      Todas as Regiões
    </button>
    <button class="region-tab" data-region="salvador" onclick="filterByRegion('salvador')">
      Salvador
    </button>
    <button class="region-tab" data-region="irece" onclick="filterByRegion('irece')">
      Irecê
    </button>
  </div>

  <!-- Projects Grid -->
  <div class="projects-grid" id="projectsGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando obras...</p>
    </div>
  </div>

  <script>
    // ==========================================
    // DATA STRUCTURE E API
    // ==========================================

    let projectsData = [];
    let filteredProjects = [];
    let currentRegion = 'todas';
    let currentMonth = '';
    let currentYear = '';
    let timelineStartDate = new Date();
    timelineStartDate.setHours(0, 0, 0, 0);

    const N8N_WEBHOOK_URL = 'https://n8n.gaussenergia.com.br/webhook/gauss-obras';

    // ==========================================
    // UTILITY FUNCTIONS
    // ==========================================

    function parseDateLocal(dateString) {
      if (!dateString) return null;
      if (dateString instanceof Date) return dateString;
      
      if (dateString.match(/^\d{4}-\d{2}-\d{2}/)) {
        const parts = dateString.split('-');
        return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      }
      
      if (dateString.match(/^\d{1,2}\/\d{1,2}\/\d{4}/)) {
        const parts = dateString.split('/');
        return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      }
      
      return new Date(dateString);
    }

    function formatDate(dateString) {
      if (!dateString) return 'Data não informada';
      const date = parseDateLocal(dateString);
      if (!date || isNaN(date)) return 'Data inválida';
      return date.toLocaleDateString('pt-BR', { 
        day: '2-digit', 
        month: '2-digit', 
        year: 'numeric' 
      });
    }

    function toggleCard(card) {
      const wasExpanded = card.classList.contains('expanded');
      document.querySelectorAll('.project-card').forEach(c => {
        c.classList.remove('expanded');
      });
      if (!wasExpanded) {
        card.classList.add('expanded');
      }
    }

    function normalizeStatus(status) {
      if (!status) return 'programada';
      const statusLower = status.toLowerCase();
      if (statusLower.includes('finalizada') || statusLower.includes('concluída')) return 'finalizada';
      if (statusLower.includes('andamento') || statusLower.includes('execução')) return 'andamento';
      if (statusLower.includes('programada') || statusLower.includes('liberada')) return 'programada';
      if (statusLower.includes('pendencia') || statusLower.includes('aguardando')) return 'pendencia';
      return 'programada';
    }

    function populateYearFilter() {
      const yearFilter = document.getElementById('yearFilter');
      const currentYear = new Date().getFullYear();
      const years = new Set();
      
      projectsData.forEach(p => {
        if (p.startDate) {
          const date = parseDateLocal(p.startDate);
          if (date && !isNaN(date)) {
            years.add(date.getFullYear());
          }
        }
      });
      
      const sortedYears = Array.from(years).sort((a, b) => b - a);
      
      sortedYears.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearFilter.appendChild(option);
      });
    }

    // ==========================================
    // TIMELINE NAVIGATION
    // ==========================================

    function updateTimelineDays() {
      renderTimeline();
    }

    function previousPeriod() {
      const daysToShow = parseInt(document.getElementById('daysToShow').value);
      timelineStartDate.setDate(timelineStartDate.getDate() - daysToShow);
      renderTimeline();
    }

    function nextPeriod() {
      const daysToShow = parseInt(document.getElementById('daysToShow').value);
      timelineStartDate.setDate(timelineStartDate.getDate() + daysToShow);
      renderTimeline();
    }

    function goToToday() {
      timelineStartDate = new Date();
      timelineStartDate.setHours(0, 0, 0, 0);
      renderTimeline();
    }

    // ==========================================
    // API - CARREGAR DADOS
    // ==========================================

    async function loadData() {
      const grid = document.getElementById('projectsGrid');
      
      grid.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Carregando obras...</p>
        </div>
      `;
      
      try {
        console.log('🔄 Buscando dados do n8n...');
        const response = await fetch(N8N_WEBHOOK_URL);
        
        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('✅ Dados recebidos:', data.length, 'itens');
        
        projectsData = data.map(item => item.json || item);
        projectsData.reverse();
        
        console.log('📊 Dados processados:', projectsData.length, 'projetos');
        console.log('📋 Primeiro projeto:', projectsData[0]);
        
        filteredProjects = [...projectsData];
        
        populateYearFilter();
        renderProjects();
        updateKPIs();
        renderTimeline();
        
      } catch (error) {
        console.error('❌ Erro ao carregar obras:', error);
        
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3 style="margin-bottom: var(--space-2);">Erro ao carregar obras</h3>
            <p style="margin-bottom: var(--space-4);">${error.message}</p>
            <button 
              onclick="loadData()" 
              style="
                padding: var(--space-3) var(--space-5);
                background: var(--gauss-green);
                color: white;
                border: none;
                border-radius: var(--radius-md);
                font-family: var(--font-display);
                font-weight: 600;
                cursor: pointer;
                font-size: var(--fs-body);
              "
            >
              Tentar Novamente
            </button>
          </div>
        `;
      }
    }

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      
      if (filteredProjects.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <p>Nenhuma obra encontrada.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredProjects.map(project => {
        const hasPending = project.pendencia && project.pendencia.trim() !== '';
        const materialSent = project.materialEnviado && 
                           (project.materialEnviado.toLowerCase() === 'sim' || 
                            project.materialEnviado.toLowerCase() === 's');
        
        return `
          <div class="project-card ${hasPending ? 'has-pending' : ''}" onclick="toggleCard(this)">
            <div class="project-header">
              <div class="project-code">${project.id || 'S/N'}</div>
              <div class="status-badge status-${normalizeStatus(project.status)}">
                ${project.status || 'Sem status'}
              </div>
            </div>
            
            <div class="project-client">${project.client || 'Cliente não informado'}</div>
            
            <div class="project-city">
              📍 ${project.city || 'Cidade não informada'}
            </div>
            
            <div class="project-meta">
              ${materialSent ? 
                '<span class="meta-badge material-sent">✓ Material Enviado</span>' : 
                '<span class="meta-badge material-pending">⏳ Material Pendente</span>'
              }
              ${hasPending ? 
                '<span class="meta-badge has-issue">⚠️ Com Pendência</span>' : 
                ''
              }
            </div>
            
            <div class="project-date" style="margin-bottom: var(--space-2);">
              👷 Equipe: <strong>${project.team || 'Não informada'}</strong>
            </div>
            
            <div class="project-date">
              🗓 Início: ${formatDate(project.startDate)}
            </div>

            ${project.endDate ? `
              <div class="project-date">
                🏁 Término Previsto: ${formatDate(project.endDate)}
              </div>
            ` : ''}

            <div class="project-details">
              <div class="detail-item">
                <div class="detail-label">Vendedor</div>
                <div class="detail-value">${project.vendor || 'Não informado'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Equipe Responsável</div>
                <div class="detail-value">${project.team || 'Não informada'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Material Enviado</div>
                <div class="detail-value">${materialSent ? '✓ Sim' : '✗ Não'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Módulos</div>
                <div class="detail-value">${project.modules || '—'} (${project.qty || '—'} un.)</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Inversor</div>
                <div class="detail-value">${project.inverter || 'Não informado'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Tipo de Telhado</div>
                <div class="detail-value">${project.roof || 'Não informado'}</div>
              </div>
              ${hasPending ? `
                <div class="detail-item" style="grid-column: span 2;">
                  <div class="detail-label">⚠️ Pendência</div>
                  <div class="detail-value alert">${project.pendencia}</div>
                </div>
              ` : ''}
              ${project.notes ? `
                <div class="detail-item" style="grid-column: span 2;">
                  <div class="detail-label">Observações</div>
                  <div class="detail-value">${project.notes}</div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateKPIs() {
      const total = filteredProjects.length;
      const programada = filteredProjects.filter(p => {
        const status = (p.status || '').toLowerCase();
        return status.includes('programada') || 
               status.includes('liberada') ||
               status.includes('aguardando');
      }).length;
      const andamento = filteredProjects.filter(p => {
        const status = (p.status || '').toLowerCase();
        return status.includes('andamento') || 
               status.includes('em execução');
      }).length;
      const concluida = filteredProjects.filter(p => {
        const status = (p.status || '').toLowerCase();
        return status.includes('finalizada') ||
               status.includes('concluída');
      }).length;

      document.getElementById('kpiTotal').textContent = total;
      document.getElementById('kpiProgramada').textContent = programada;
      document.getElementById('kpiAndamento').textContent = andamento;
      document.getElementById('kpiConcluida').textContent = concluida;
    }

    function renderTimeline() {
      const daysToShow = parseInt(document.getElementById('daysToShow').value);
      const startDate = new Date(timelineStartDate);
      
      const monthNames = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 
                         'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
      
      // Atualizar título do mês
      const endDate = new Date(startDate);
      endDate.setDate(endDate.getDate() + daysToShow - 1);
      
      let titleText = '';
      if (startDate.getMonth() === endDate.getMonth()) {
        titleText = `${monthNames[startDate.getMonth()]} ${startDate.getFullYear()}`;
      } else {
        titleText = `${monthNames[startDate.getMonth()]} - ${monthNames[endDate.getMonth()]} ${startDate.getFullYear()}`;
      }
      
      document.getElementById('timelineMonth').textContent = titleText;

      // Mostrar/ocultar hint de scroll
      const scrollHint = document.getElementById('scrollHint');
      if (daysToShow > 14) {
        scrollHint.style.display = 'block';
      } else {
        scrollHint.style.display = 'none';
      }

      // ===== RENDER DIAS =====
      const daysContainer = document.getElementById('timelineDays');
      const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      
      // Adicionar classe para muitos dias
      if (daysToShow > 14) {
        daysContainer.classList.add('many-days');
      } else {
        daysContainer.classList.remove('many-days');
      }
      
      // Ajustar grid columns dinamicamente
      daysContainer.style.gridTemplateColumns = `repeat(${daysToShow}, 1fr)`;
      
      let daysHTML = '';
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      for (let i = 0; i < daysToShow; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);
        
        const isToday = date.getTime() === today.getTime();
        
        daysHTML += `
          <div class="timeline-day" style="${isToday ? 'background: var(--gauss-green-100); border: 2px solid var(--gauss-green);' : ''}">
            <div class="timeline-day-num">${date.getDate()}</div>
            <div class="timeline-day-name">${dayNames[date.getDay()]}</div>
            ${isToday ? '<div style="font-size: 10px; color: var(--gauss-green-900); font-weight: 700;">HOJE</div>' : ''}
          </div>
        `;
      }
      daysContainer.innerHTML = daysHTML;

      // ===== FILTRAR PROJETOS PARA O PERÍODO =====
      const periodEnd = new Date(startDate);
      periodEnd.setDate(periodEnd.getDate() + daysToShow - 1);
      periodEnd.setHours(23, 59, 59, 999);

      const projectsInPeriod = filteredProjects
        .filter(p => {
          if (!p.startDate) return false;
          
          const projectStart = parseDateLocal(p.startDate);
          if (!projectStart || isNaN(projectStart)) return false;
          
          projectStart.setHours(0, 0, 0, 0);
          
          // Determinar data de término
          let projectEnd;
          if (p.endDate) {
            projectEnd = parseDateLocal(p.endDate);
            if (!projectEnd || isNaN(projectEnd)) {
              projectEnd = new Date(periodEnd);
            }
          } else {
            const status = (p.status || '').toLowerCase();
            const isFinished = status.includes('finalizada') || status.includes('concluída');
            
            if (isFinished) {
              projectEnd = new Date(projectStart);
            } else {
              projectEnd = new Date(periodEnd);
            }
          }
          
          projectEnd.setHours(23, 59, 59, 999);
          
          // Verificar se o projeto tem interseção com o período visível
          return projectStart <= periodEnd && projectEnd >= startDate;
        })
        .sort((a, b) => parseDateLocal(a.startDate) - parseDateLocal(b.startDate))
        .slice(0, 15);

      const projectsContainer = document.getElementById('timelineProjects');
      
      if (projectsInPeriod.length === 0) {
        projectsContainer.innerHTML = `
          <p style="text-align: center; color: var(--fg-3); padding: var(--space-4);">
            Nenhum projeto programado para este período.
          </p>
        `;
        return;
      }

      console.log('📅 Projetos na timeline:', projectsInPeriod.map(p => ({
        id: p.id,
        client: p.client,
        startDate: p.startDate,
        endDate: p.endDate,
        status: p.status
      })));

      // ===== RENDER PROJETOS =====
      projectsContainer.innerHTML = projectsInPeriod.map(p => {
        const projectStart = parseDateLocal(p.startDate);
        projectStart.setHours(0, 0, 0, 0);
        
        // Calcular data de término
        let projectEnd;
        if (p.endDate) {
          projectEnd = parseDateLocal(p.endDate);
          if (!projectEnd || isNaN(projectEnd)) {
            projectEnd = new Date(periodEnd);
          }
        } else {
          const status = (p.status || '').toLowerCase();
          const isFinished = status.includes('finalizada') || status.includes('concluída');
          
          if (isFinished) {
            projectEnd = new Date(projectStart);
          } else {
            projectEnd = new Date(periodEnd);
          }
        }
        
        projectEnd.setHours(0, 0, 0, 0);
        
        // Calcular posicionamento no grid
        const dayStart = Math.max(0, Math.floor((projectStart - startDate) / (1000 * 60 * 60 * 24)));
        const dayEnd = Math.min(daysToShow - 1, Math.floor((projectEnd - startDate) / (1000 * 60 * 60 * 24)));
        
        const gridColumnStart = dayStart + 1;
        const gridColumnEnd = dayEnd + 2;
        
        // Ajustar tamanho do texto baseado no número de dias
        const fontSize = daysToShow > 14 ? 'var(--fs-xs)' : 'var(--fs-xs)';
        const padding = daysToShow > 14 ? 'var(--space-1) var(--space-2)' : 'var(--space-2) var(--space-3)';
        
        // Truncar nome do cliente
        const clientName = p.client || 'Cliente não informado';
        const maxLength = daysToShow > 14 ? 20 : 25;
        const shortClientName = clientName.length > maxLength 
          ? clientName.substring(0, maxLength) + '...' 
          : clientName;
        
        const teamName = p.team || 'Não informada';
        
        // Definir cor baseada no status
        let bgColor = 'var(--gauss-green-100)';
        let borderColor = 'var(--gauss-green)';
        const status = (p.status || '').toLowerCase();
        
        if (status.includes('finalizada') || status.includes('concluída')) {
          bgColor = '#E6F5EA';
          borderColor = '#1B5D24';
        } else if (status.includes('pendencia')) {
          bgColor = '#FEE';
          borderColor = '#B91C1C';
        }
        
        return `
          <div class="timeline-project-row" style="
            display: grid;
            grid-template-columns: repeat(${daysToShow}, 1fr);
            gap: var(--space-2);
            margin-bottom: var(--space-3);
          ">
            <div class="timeline-project-bar" style="
              grid-column: ${gridColumnStart} / ${gridColumnEnd};
              background: ${bgColor};
              border-left: 3px solid ${borderColor};
              border-radius: var(--radius-sm);
              padding: ${padding};
              position: relative;
              transition: all 0.2s;
              cursor: pointer;
              min-height: ${daysToShow > 14 ? '50px' : '60px'};
            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='var(--shadow-sm)'" 
               onmouseout="this.style.transform=''; this.style.boxShadow=''"
               title="${clientName} - ${teamName} | ${formatDate(p.startDate)} - ${p.endDate ? formatDate(p.endDate) : 'Em andamento'}">
              
              <div style="
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: ${daysToShow > 14 ? '2px' : '4px'};
              ">
                <span style="
                  font-family: var(--font-mono);
                  font-size: ${fontSize};
                  font-weight: 700;
                  color: ${borderColor};
                  white-space: nowrap;
                ">
                  ${p.id || 'S/N'}
                </span>
                <span style="
                  font-size: ${fontSize};
                  color: var(--fg-1);
                  font-weight: 600;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
                ">
                  ${shortClientName}
                </span>
              </div>
              
              <div style="
                font-size: ${fontSize};
                color: var(--fg-2);
                margin-bottom: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
              ">
                👷 ${teamName}
              </div>
              
              ${daysToShow <= 14 ? `
                <div style="
                  font-size: ${fontSize};
                  color: var(--fg-3);
                  font-style: italic;
                ">
                  ${p.status || 'Sem status'}${!p.endDate && !status.includes('finalizada') ? ' • Em andamento' : ''}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // FILTER & SEARCH
    // ==========================================

    function filterByRegion(region) {
      currentRegion = region;
      
      document.querySelectorAll('.region-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.region === region) {
          tab.classList.add('active');
        }
      });

      applyFilters();
    }

    function filterByPeriod() {
      currentMonth = document.getElementById('monthFilter').value;
      currentYear = document.getElementById('yearFilter').value;
      applyFilters();
    }

    function resetPeriodFilter() {
      document.getElementById('monthFilter').value = '';
      document.getElementById('yearFilter').value = '';
      currentMonth = '';
      currentYear = '';
      applyFilters();
    }

    function searchProjects(query) {
      applyFilters(query);
    }

    function applyFilters(searchQuery = '') {
      filteredProjects = projectsData.filter(project => {
        const regionMatch = currentRegion === 'todas' || project.region === currentRegion;
        
        let periodMatch = true;
        if (currentMonth || currentYear) {
          if (project.startDate) {
            const date = parseDateLocal(project.startDate);
            if (date && !isNaN(date)) {
              const monthMatch = !currentMonth || (date.getMonth() + 1) === parseInt(currentMonth);
              const yearMatch = !currentYear || date.getFullYear() === parseInt(currentYear);
              periodMatch = monthMatch && yearMatch;
            } else {
              periodMatch = false;
            }
          } else {
            periodMatch = false;
          }
        }
        
        const searchLower = searchQuery.toLowerCase();
        const searchMatch = !searchQuery || 
          (project.id || '').toLowerCase().includes(searchLower) ||
          (project.client || '').toLowerCase().includes(searchLower) ||
          (project.city || '').toLowerCase().includes(searchLower);

        return regionMatch && periodMatch && searchMatch;
      });

      renderProjects();
      updateKPIs();
      renderTimeline();
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchProjects(e.target.value);
    });

    document.getElementById('monthFilter').addEventListener('change', filterByPeriod);
    document.getElementById('yearFilter').addEventListener('change', filterByPeriod);

    // ==========================================
    // INITIALIZE
    // ==========================================

    loadData();

    setInterval(() => {
      console.log('🔄 Atualizando dados automaticamente...');
      loadData();
    }, 5 * 60 * 1000);
    
  </script>
</body>
</html>
